  <header class="header">

      <div class="lang-switch" id="langSwitcher">

  <section class="services">

      <div class="service-grid">

        <a href="zayavka.html?usluga=Плиссе" class="service-item">
          <img src="/images/plisse.png" alt="Плиссе">
          <h4 data-i18n="item2-title">Плиссе</h4>
          <p data-i18n="item2-desc">Гофрированные, без складок</p>
        </a>
      </div>
      <div style="margin-top:30px;"><a href="index.html" class="more-link"><i class="fas fa-arrow-left"></i> <span data-i18n="back">На главную</span></a></div>
    </div>
  </section>

  <!-- форма и cta такие же, как на других страницах -->
  <section class="form-section">...</section>
  <section class="cta-final">...</section>
  <footer class="footer">...</footer>

  <script>
    // переводы для этой страницы (только ролеры и плиссе)
    const translations = {
      ru: {
        "header-tag": "Ташкент с 2019",
        "page-title": "Жалюзи",
        "subtitle": "Выберите вид жалюзи:",
        "item1-title": "Ролеры",
        "item1-desc": "Тканевые роллеты, день-ночь",
        "item2-title": "Плиссе",
        "item2-desc": "Гофрированные, без складок",
        "back": "На главную",
        "form-title": "Оставьте заявку",
        "form-sub": "Мы перезвоним в течение 15 минут",
        "form-service": "Услуга",
        "form-opt1": "Ролеры",
        "form-opt2": "Плиссе",
        "form-name": "Ваше имя",
        "form-phone": "Номер телефона",
        "form-submit": "Отправить заявку",
        "form-agree": "Нажимая кнопку, вы соглашаетесь с обработкой персональных данных",
        "cta-title": "Готовы сделать заказ?",
        "cta-desc": "Позвоните или напишите нам в Telegram – мы ответим на все вопросы.",
        "cta-telegram": "Написать в Telegram"
      },
      uz: {
        "header-tag": "Toshkent 2019 dan",
        "page-title": "Jalyuzi",
        "subtitle": "Jalyuzi turini tanlang:",
        "item1-title": "Rolery",
        "item1-desc": "Matoli roletlar, kech-kunduz",
        "item2-title": "Plisse",
        "item2-desc": "Gofrirovka, burmalarsiz",
        "back": "Bosh sahifaga",
        "form-title": "Ariza qoldiring",
        "form-sub": "15 daqiqa ichida qayta qo‘ng‘iroq qilamiz",
        "form-service": "Xizmat",
        "form-opt1": "Rolery",
        "form-opt2": "Plisse",
        "form-name": "Ismingiz",
        "form-phone": "Telefon raqam",
        "form-submit": "Arizani yuborish",
        "form-agree": "Tugmani bosish orqali siz shaxsiy ma'lumotlarni qayta ishlashga rozilik bildirasiz",
        "cta-title": "Buyurtma berishga tayyormisiz?",
        "cta-desc": "Qo‘ng‘iroq qiling yoki Telegramda yozing – barcha savollarga javob beramiz.",
        "cta-telegram": "Telegramda yozish"
      },
      en: {
        "header-tag": "Tashkent since 2019",
        "page-title": "Blinds",
        "subtitle": "Select blind type:",
        "item1-title": "Roller",
        "item1-desc": "Fabric roller blinds, day-night",
        "item2-title": "Pleated",
        "item2-desc": "Pleated, crease-free",
        "back": "Main page",
        "form-title": "Leave a request",
        "form-sub": "We will call you back within 15 minutes",
        "form-service": "Service",
        "form-opt1": "Roller",
        "form-opt2": "Pleated",
        "form-name": "Your name",
        "form-phone": "Phone number",
        "form-submit": "Submit request",
        "form-agree": "By clicking the button, you agree to the processing of personal data",
        "cta-title": "Ready to order?",
        "cta-desc": "Call or write to Telegram – we will answer all questions.",
        "cta-telegram": "Write to Telegram"
      }
    };
    // скрипт переключения языков (такой же, как на главной)
    let currentLang = 'ru';
    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-switch a[data-lang]').forEach(el => {
        el.classList.toggle('active', el.dataset.lang === lang);
      });
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-switch a[data-lang]').forEach(el => {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        setLanguage(this.dataset.lang);
      });
    });
    const savedLang = localStorage.getItem('lang') || 'ru';
    setLanguage(savedLang);
  </script>
</body>
</html>
