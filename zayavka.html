<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оставить заявку | Moskitki.uz</title>
  <!-- Open Graph -->
  <meta property="og:title" content="Оставить заявку — Moskitki.uz" />
  <meta property="og:description" content="Оставьте заявку на услуги Moskitki.uz. Мы перезвоним в течение 15 минут." />
  <meta property="og:image" content="https://moskitki.uz/images/logo.png" />
  <meta property="og:url" content="https://moskitki.uz/zayavka.html" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Заявка — Moskitki.uz" />
  <meta name="twitter:description" content="Быстрая заявка на услуги." />
  <meta name="twitter:image" content="https://moskitki.uz/images/logo.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, system-ui, sans-serif; }
    body { background: #f8faff; color: #1e293b; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
    .header { background: #0b2b5c; color: #fff; padding: 16px 0; border-bottom: 3px solid #f7b731; }
    .header .container { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-text { font-weight: 700; font-size: 24px; letter-spacing: -0.5px; display: flex; align-items: center; gap: 10px; }
    .logo-text span { color: #f7b731; }
    .logo-text img { height: 36px; width: auto; border-radius: 8px; }
    .lang-switch { display: flex; gap: 8px; font-size: 14px; font-weight: 500; background: rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 40px; flex-wrap: wrap; align-items: center; }
    .lang-switch a { color: rgba(255,255,255,0.7); text-decoration: none; transition: .2s; display: flex; align-items: center; gap: 5px; font-size: 15px; cursor: pointer; }
    .lang-switch a.active { color: #fff; font-weight: 600; }
    .lang-switch a .flag { font-size: 20px; line-height: 1; }
    .header-tag { font-size: 14px; background: #1d3d72; padding: 6px 14px; border-radius: 40px; display: inline-block; font-weight: 400; }
    .form-section { padding: 60px 0; background: #f2f7fe; min-height: 70vh; }
    .form-card { max-width: 700px; margin: 0 auto; background: #fff; padding: 40px 36px; border-radius: 36px; box-shadow: 0 12px 30px rgba(11,43,92,.06); }
    .form-card h2 { font-size: 28px; font-weight: 700; color: #0b2b5c; margin-bottom: 8px; }
    .form-card .sub { color: #4b5b6e; margin-bottom: 24px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { font-weight: 500; display: block; margin-bottom: 6px; color: #1e293b; }
    .form-group input, .form-group select { width: 100%; padding: 14px 18px; border: 1px solid #dce6f0; border-radius: 30px; font-size: 16px; background: #fafcff; transition: .2s; }
    .form-group input:focus { border-color: #0b2b5c; outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(11,43,92,.05); }
    .form-btn { background: #0b2b5c; color: #fff; border: none; padding: 16px 32px; font-size: 18px; font-weight: 600; border-radius: 60px; width: 100%; cursor: pointer; transition: .2s; display: flex; align-items: center; justify-content: center; gap: 12px; }
    .form-btn i { color: #f7b731; }
    .form-btn:hover { background: #1a3d72; }
    .form-agree { font-size: 13px; color: #6b7b8e; margin-top: 16px; text-align: center; }
    .back-link { display: inline-block; margin-bottom: 20px; font-weight: 600; color: #0b2b5c; text-decoration: none; border-bottom: 2px solid #f7b731; padding-bottom: 2px; }
    .footer { background: #061f41; padding: 24px 0; color: rgba(255,255,255,.7); border-top: 1px solid #1a3d72; }
    .footer .container { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; }
    .footer .copy { font-size: 14px; }
    .footer .footer-logo { color: #fff; font-weight: 600; font-size: 18px; display: flex; align-items: center; gap: 8px; }
    .footer .footer-logo img { height: 28px; width: auto; border-radius: 6px; }
    @media(max-width:600px){ .form-card { padding: 28px 18px; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="container">
      <div class="logo-area">
        <div class="logo-text"><img src="/images/logo.png" alt="Логотип"> Moskitki.<span>uz</span></div>
      </div>
      <div class="lang-switch" id="langSwitcher">
        <a data-lang="ru" class="active"><span class="flag">🇷🇺</span> RU</a>
        <a data-lang="uz"><span class="flag">🇺🇿</span> UZ</a>
        <a data-lang="en"><span class="flag">🇬🇧</span> EN</a>
        <span class="header-tag" data-i18n="header-tag">Ташкент с 2019</span>
      </div>
    </div>
  </header>

  <section class="form-section">
    <div class="container">
      <div class="form-card">
        <a href="javascript:history.back()" class="back-link" data-i18n="back"><i class="fas fa-arrow-left"></i> Назад</a>
        <h2><i class="fas fa-pencil-alt" style="color:#f7b731;"></i> <span data-i18n="form-title">Оставьте заявку</span></h2>
        <p class="sub" data-i18n="form-sub">Мы перезвоним в течение 15 минут</p>
        <form id="zayavkaForm" action="#" method="GET">
          <div class="form-group">
            <label data-i18n="form-service">Услуга</label>
            <select id="uslugaSelect" name="usluga">
              <option value="Монтаж, демонтаж и заправка кондиционера" data-i18n="form-opt1">Монтаж, демонтаж и заправка кондиционера</option>
              <option value="Москитная сетка" data-i18n="form-opt2">Москитная сетка</option>
              <option value="Ремонт окон" data-i18n="form-opt3">Ремонт окон</option>
              <option value="Жалюзи" data-i18n="form-opt4">Жалюзи</option>
              <option value="Создание сайта" data-i18n="form-opt5">Создание сайта</option>
              <!-- сюда будут добавляться опции через JS, если в URL пришла нестандартная услуга -->
            </select>
          </div>
          <div class="form-group">
            <label data-i18n="form-name">Ваше имя</label>
            <input type="text" placeholder="Ваше имя" name="name" id="userName">
          </div>
          <div class="form-group">
            <label data-i18n="form-phone">Номер телефона</label>
            <input type="tel" placeholder="+998 99 055 06 60" name="phone" id="userPhone">
          </div>
          <button type="submit" class="form-btn"><i class="fas fa-paper-plane"></i> <span data-i18n="form-submit">Отправить заявку</span></button>
          <div class="form-agree" data-i18n="form-agree">Нажимая кнопку, вы соглашаетесь с обработкой персональных данных</div>
        </form>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-logo"><img src="/images/logo.png" alt="Moskitki.uz"> Moskitki.uz</div>
      <div class="copy">© 2019 – 2026 — Toshkent</div>
    </div>
  </footer>

  <script>
    // ===== ПЕРЕВОДЫ ДЛЯ ЭТОЙ СТРАНИЦЫ =====
    const translations = {
      ru: {
        "header-tag": "Ташкент с 2019",
        "back": "Назад",
        "form-title": "Оставьте заявку",
        "form-sub": "Мы перезвоним в течение 15 минут",
        "form-service": "Услуга",
        "form-opt1": "Монтаж, демонтаж и заправка кондиционера",
        "form-opt2": "Москитная сетка",
        "form-opt3": "Ремонт окон",
        "form-opt4": "Жалюзи",
        "form-opt5": "Создание сайта",
        "form-name": "Ваше имя",
        "form-phone": "Номер телефона",
        "form-submit": "Отправить заявку",
        "form-agree": "Нажимая кнопку, вы соглашаетесь с обработкой персональных данных"
      },
      uz: {
        "header-tag": "Toshkent 2019 dan",
        "back": "Orqaga",
        "form-title": "Ariza qoldiring",
        "form-sub": "15 daqiqa ichida qayta qo‘ng‘iroq qilamiz",
        "form-service": "Xizmat",
        "form-opt1": "Konditsionerni o‘rnatish, demontaj va freon quyish",
        "form-opt2": "Chivin to‘ri",
        "form-opt3": "Deraza ta'miri",
        "form-opt4": "Jalyuzi",
        "form-opt5": "Veb-sayt yaratish",
        "form-name": "Ismingiz",
        "form-phone": "Telefon raqam",
        "form-submit": "Arizani yuborish",
        "form-agree": "Tugmani bosish orqali siz shaxsiy ma'lumotlarni qayta ishlashga rozilik bildirasiz"
      },
      en: {
        "header-tag": "Tashkent since 2019",
        "back": "Back",
        "form-title": "Leave a request",
        "form-sub": "We will call you back within 15 minutes",
        "form-service": "Service",
        "form-opt1": "Installation, dismantling and refrigerant charging",
        "form-opt2": "Mosquito net",
        "form-opt3": "Window repair",
        "form-opt4": "Blinds",
        "form-opt5": "Website creation",
        "form-name": "Your name",
        "form-phone": "Phone number",
        "form-submit": "Submit request",
        "form-agree": "By clicking the button, you agree to the processing of personal data"
      }
    };

    // ===== ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА =====
    let currentLang = 'ru';
    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-switch a[data-lang]').forEach(el => {
        el.classList.toggle('active', el.dataset.lang === lang);
      });
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.dataset.i18n;
        if (translations[lang] && translations[lang][key]) {
          el.textContent = translations[lang][key];
        }
      });
      localStorage.setItem('lang', lang);
    }
    document.querySelectorAll('.lang-switch a[data-lang]').forEach(el => {
      el.addEventListener('click', function(e) {
        e.preventDefault();
        setLanguage(this.dataset.lang);
      });
    });
    const savedLang = localStorage.getItem('lang') || 'ru';
    setLanguage(savedLang);

    // ===== АВТОЗАПОЛНЕНИЕ УСЛУГИ ИЗ URL =====
    const urlParams = new URLSearchParams(window.location.search);
    const usluga = urlParams.get('usluga');
    if (usluga) {
      const select = document.getElementById('uslugaSelect');
      let found = false;
      for (let option of select.options) {
        if (option.value === usluga) {
          option.selected = true;
          found = true;
          break;
        }
      }
      if (!found) {
        // если такой услуги нет в списке – добавляем как новый вариант
        const newOpt = document.createElement('option');
        newOpt.value = usluga;
        newOpt.textContent = usluga;
        newOpt.selected = true;
        select.appendChild(newOpt);
      }
    }
  </script>
</body>
</html>
